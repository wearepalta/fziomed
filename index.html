      const url = signal.source_url;
      return h('div', {
        className: 'border-l-2 pl-4 py-3',
        style: { borderColor: source.color }
      },
        h('div', { className: 'flex items-baseline justify-between gap-3 mb-1.5' },
          h('div', {
            className: 'text-[10px] uppercase tracking-widest font-mono',
            style: { color: '#7A8B6A' }
          },
            h('span', { style: { color: source.color } }, source.label),
            ' · ',
            formatDate(signal.signal_date)
          ),
          score != null && h('div', {
            className: 'text-sm font-bold tabular-nums shrink-0',
            style: { color: scoreColor }
          }, score)
        ),
        h('div', { className: 'text-sm text-white/90 leading-snug mb-2' },
          signal.signal_headline_or_title
        ),
        h('div', { className: 'flex items-center gap-2 flex-wrap' },
          signal.signal_category && h('span', {
            className: 'text-[10px] font-mono px-1.5 py-0.5 rounded-sm',
            style: { background: 'rgba(255,255,255,0.05)', color: '#94A3B8' }
          }, signal.signal_category),
          url && h('a', {
            href: url, target: '_blank', rel: 'noreferrer',
            className: 'text-[10px] font-mono ml-auto hover:underline',
            style: { color: '#B5F33D' }
          }, 'source ↗')
        )
      );
    }

    function EmptySourcePlaceholder({ label, color }) {
      return h('div', {
        className: 'border-l-2 pl-4 py-3',
        style: { borderColor: color, opacity: 0.35 }
      },
        h('div', {
          className: 'text-[10px] uppercase tracking-widest font-mono mb-1',
          style: { color }
        }, label),
        h('div', {
          className: 'text-xs italic',
          style: { color: '#5A7048' }
        }, 'No findings in this category')
      );
    }

    // ============================================================
    // DETAIL PANEL
    // ============================================================
    function DetailPanel({ lead }) {
      const leadSignals = useMemo(() =>
        SIGNALS_DATA.filter(s => s.lead_id === lead.lead_id)
          .sort((a, b) => (b.normalized_signal_score || 0) - (a.normalized_signal_score || 0)),
        [lead.lead_id]
      );

      const tier = TIER_CONFIG[lead.priority_tier] || TIER_CONFIG['Tier 3 / Watchlist'];
      const bucketColor = BUCKET_COLORS[lead.primary_fziomed_bucket] || '#94A3B8';
      const isNew = lead.priority_tier === 'NEW';
      const isSilent = lead.priority_tier === 'SILENT';
      const noRank = isNew || isSilent;

      const interpretations = (lead.manager_interpretation || '')
        .split(/;\s*(?=[A-Z])/)
        .map(s => s.replace(/Manager context:.*$/, '').trim())
        .filter(Boolean);

      return h('div', {
        className: 'h-full overflow-y-auto',
        style: { background: '#0D1F0A' }
      },
        // Header band
        h('div', {
          className: 'relative px-8 pt-8 pb-6',
          style: { background: 'linear-gradient(180deg, rgba(181,243,61,0.04) 0%, transparent 100%)' }
        },
          h('div', { className: 'flex items-start justify-between gap-6 mb-6' },
            h('div', { className: 'min-w-0' },
              h('div', { className: 'flex items-center gap-3 mb-2 flex-wrap' },
                !noRank && h('span', {
                  className: 'text-xs font-mono tracking-widest',
                  style: { color: '#B5F33D' }
                }, 'RANK #' + String(lead.rank).padStart(2, '0')),
                h('span', {
                  className: 'text-xs font-mono px-2 py-0.5 rounded-sm',
                  style: { background: tier.color + '22', color: tier.color }
                }, tier.label),
                lead.primary_fziomed_bucket && h('span', {
                  className: 'text-xs font-mono',
                  style: { color: bucketColor }
                }, '● ', lead.primary_fziomed_bucket)
              ),
              h('h1', {
                className: 'text-4xl font-bold text-white tracking-tight mb-1 leading-tight'
              }, lead.lead_company),
              lead.lead_domain
                ? h('a', {
                    href: 'https://' + lead.lead_domain,
                    target: '_blank', rel: 'noreferrer',
                    className: 'text-sm font-mono hover:underline',
                    style: { color: '#7A8B6A' }
                  }, lead.lead_domain, ' ↗')
                : h('div', {
                    className: 'text-sm font-mono',
                    style: { color: '#7A8B6A' }
                  }, lead.lead_type || '')
            )
          ),
          h('div', {
            className: 'grid grid-cols-2 gap-6 pt-4 border-t',
            style: { borderColor: 'rgba(255,255,255,0.06)' }
          },
            h('div', null,
              h('div', {
                className: 'text-[10px] uppercase tracking-widest font-mono mb-2',
                style: { color: '#7A8B6A' }
              }, 'Priority Score'),
              h(ScoreBar, {
                score: lead.consolidated_priority_score,
                emptyLabel: isSilent ? 'No score this window' : 'Not scored — context only'
              })
            ),
            h('div', null,
              h('div', {
                className: 'text-[10px] uppercase tracking-widest font-mono mb-2',
                style: { color: '#7A8B6A' }
              }, 'Signals Found'),
              h('div', {
                className: 'text-3xl font-bold tabular-nums text-white'
              }, lead.number_of_unique_signals || 0)
            )
          )
        ),

        // SILENT-specific message
        isSilent && h('div', { className: 'px-8 py-8' },
          h('div', {
            className: 'p-6 rounded-sm',
            style: { background: 'rgba(71,85,105,0.08)', border: '1px dashed rgba(71,85,105,0.3)' }
          },
            h('div', {
              className: 'text-[10px] uppercase tracking-widest font-mono mb-3',
              style: { color: '#94A3B8' }
            }, '── No signals captured this window'),
            h('p', {
              className: 'text-sm leading-relaxed',
              style: { color: '#A0B090' }
            }, 'This lead is on the watchlist but produced no signals across Company News, Topic News, or Papers / Funding during the current observation window. Continued monitoring; no action required at this time.')
          )
        ),

        // Strongest signal — hidden for SILENT
        !isSilent && lead.strongest_signal_headline_or_title && h('div', { className: 'px-8 py-6' },
          h(SectionHeader, null, 'Strongest Signal'),
          h('div', {
            className: 'p-5 rounded-sm',
            style: { background: 'rgba(181,243,61,0.05)', border: '1px solid rgba(181,243,61,0.15)' }
          },
            h('div', {
              className: 'text-xs font-mono mb-2',
              style: { color: '#B5F33D' }
            }, formatDate(lead.strongest_signal_date)),
            h('div', {
              className: 'text-base text-white leading-snug mb-3'
            }, lead.strongest_signal_headline_or_title),
            lead.strongest_signal_url && h('a', {
              href: lead.strongest_signal_url,
              target: '_blank', rel: 'noreferrer',
              className: 'text-[11px] font-mono hover:underline',
              style: { color: '#B5F33D' }
            }, 'source ↗')
          )
        ),

        // Signals by source — hidden for SILENT
        !isSilent && h('div', { className: 'px-8 py-4' },
          h(SectionHeader, null, 'Signals by Source (' + leadSignals.length + ')'),
          h('div', { className: 'space-y-6' },
            SOURCE_CONFIG.map(src => {
              const sigs = leadSignals.filter(s => getSignalSource(s).label === src.label);
              return h('div', { key: src.label },
                h('div', { className: 'flex items-baseline gap-2 mb-2' },
                  h('span', {
                    className: 'text-[10px] uppercase tracking-widest font-mono',
                    style: { color: src.color }
                  }, src.label),
                  h('span', {
                    className: 'text-[10px] font-mono',
                    style: { color: '#5A7048' }
                  }, sigs.length + ' ' + (sigs.length === 1 ? 'finding' : 'findings'))
                ),
                h('div', { className: 'space-y-1' },
                  sigs.length > 0
                    ? sigs.map((sig, i) => h(SignalRow, { key: i, signal: sig }))
                    : h(EmptySourcePlaceholder, { label: src.label, color: src.color })
                )
              );
            })
          )
        ),

        // FZIOMED relevance
        interpretations.length > 0 && h('div', { className: 'px-8 py-4 pb-8' },
          h(SectionHeader, null, 'FZIOMED Relevance'),
          h('ul', { className: 'space-y-3' },
            interpretations.map((interp, i) =>
              h('li', {
                key: i,
                className: 'text-sm text-white/75 leading-relaxed pl-4 border-l',
                style: { borderColor: 'rgba(181,243,61,0.2)' }
              }, interp)
            )
          )
        )
      );
    }

    // ============================================================
    // MAIN APP
    // ============================================================
    function App() {
      const [selectedId, setSelectedId] = useState(PRIORITY_DATA[0] && PRIORITY_DATA[0].lead_id);
      const [tierFilter, setTierFilter] = useState('all');
      const [bucketFilter, setBucketFilter] = useState('all');

      const buckets = useMemo(() =>
        [...new Set(PRIORITY_DATA.map(l => l.primary_fziomed_bucket).filter(Boolean))],
        []
      );

      const filtered = useMemo(() =>
        PRIORITY_DATA.filter(l => {
          if (tierFilter !== 'all' && l.priority_tier !== tierFilter) return false;
          if (bucketFilter !== 'all' && l.primary_fziomed_bucket !== bucketFilter) return false;
          return true;
        }),
        [tierFilter, bucketFilter]
      );

      const selected = PRIORITY_DATA.find(l => l.lead_id === selectedId);

      const tierCounts = useMemo(() => {
        const c = { 'Tier 1 / Highest priority': 0, 'Tier 2 / High priority': 0, 'Tier 3 / Watchlist': 0, 'NEW': 0, 'SILENT': 0 };
        PRIORITY_DATA.forEach(l => { if (c[l.priority_tier] !== undefined) c[l.priority_tier]++; });
        return c;
      }, []);

      return h('div', { className: 'min-h-screen w-full' },
        // Decorative squares (top right only)
        h('div', {
          className: 'fixed top-0 right-0 w-32 h-32 pointer-events-none',
          style: { background: '#B5F33D', opacity: 0.9 }
        }),
        h('div', {
          className: 'fixed top-32 right-32 w-16 h-16 pointer-events-none',
          style: { background: '#B5F33D', opacity: 0.5 }
        }),

        // Top bar
        h('header', {
          className: 'relative z-10 px-8 py-5 flex items-center border-b',
          style: {
            borderColor: 'rgba(255,255,255,0.06)',
            background: 'rgba(8,21,5,0.8)',
            backdropFilter: 'blur(8px)'
          }
        },
          h('div', { className: 'flex items-center gap-4' },
            h('div', { className: 'flex items-center gap-2' },
              h('div', { className: 'grid grid-cols-2 gap-0.5' },
                h('div', { className: 'w-2 h-2', style: { background: '#B5F33D' } }),
                h('div', { className: 'w-2 h-2', style: { background: '#B5F33D', opacity: 0.4 } }),
                h('div', { className: 'w-2 h-2', style: { background: '#B5F33D', opacity: 0.4 } }),
                h('div', { className: 'w-2 h-2', style: { background: '#B5F33D' } })
              ),
              h('span', { className: 'text-sm font-semibold tracking-tight' }, 'wearepalta')
            ),
            h('div', { className: 'h-4 w-px', style: { background: 'rgba(255,255,255,0.15)' } }),
            h('span', { className: 'text-sm font-semibold tracking-tight text-white' }, 'FZIOMED')
          )
        ),

        // Hero band
        h('section', { className: 'relative z-10 px-8 py-12 max-w-[1600px] mx-auto' },
          h('div', { className: 'mb-8' },
            h('h1', {
              className: 'text-6xl font-bold tracking-tight leading-[1] mb-5'
            },
              'Signaling ',
              h('span', { style: { color: '#B5F33D' } }, 'Radar'),
              '.'
            ),
            h('p', {
              className: 'text-base max-w-xl leading-relaxed',
              style: { color: '#A0B090' }
            }, "Custom signals harvested across company news, scientific funding, and market topics.")
          ),
          h('div', { className: 'grid grid-cols-12 gap-8 items-end' },
            // Left: stats
            h('div', { className: 'col-span-4 flex flex-col gap-2 text-xs font-mono' },
              h('div', { className: 'flex items-baseline gap-3' },
                h('span', {
                  className: 'tabular-nums text-2xl font-bold',
                  style: { color: '#B5F33D' }
                }, PRIORITY_DATA.length),
                h('span', {
                  className: 'uppercase tracking-widest',
                  style: { color: '#7A8B6A' }
                }, 'leads')
              ),
              h('div', { className: 'flex items-baseline gap-3' },
                h('span', { className: 'tabular-nums text-2xl font-bold text-white' }, SIGNALS_DATA.length),
                h('span', {
                  className: 'uppercase tracking-widest',
                  style: { color: '#7A8B6A' }
                }, 'signals')
              ),
              h('div', { className: 'flex items-baseline gap-3' },
                h('span', {
                  className: 'tabular-nums text-sm font-semibold text-white/80'
                }, '2025-04 → 2026-05'),
                h('span', {
                  className: 'uppercase tracking-widest',
                  style: { color: '#7A8B6A' }
                }, 'window')
              )
            ),
            // Right: tier breakdown
            h('div', { className: 'col-span-8 grid grid-cols-5 gap-3' },
              Object.entries(tierCounts).map(([tier, count]) => {
                const cfg = TIER_CONFIG[tier];
                return h('div', {
                  key: tier,
                  className: 'p-4',
                  style: { background: 'rgba(181,243,61,0.03)', borderTop: '2px solid ' + cfg.color }
                },
                  h('div', {
                    className: 'text-[10px] uppercase tracking-widest font-mono mb-2',
                    style: { color: cfg.color }
                  }, cfg.label),
                  h('div', { className: 'text-3xl font-bold tabular-nums' }, count),
                  h('div', {
                    className: 'text-[10px] font-mono mt-1',
                    style: { color: '#7A8B6A' }
                  }, cfg.short.toLowerCase())
                );
              })
            )
          )
        ),

        // Filters
        h('section', { className: 'relative z-10 px-8 pb-4 max-w-[1600px] mx-auto' },
          h('div', { className: 'flex items-center gap-2 flex-wrap' },
            h('span', {
              className: 'text-[10px] uppercase tracking-widest font-mono mr-2',
              style: { color: '#7A8B6A' }
            }, 'Tier:'),
            [['all', 'All'], ...Object.entries(TIER_CONFIG).map(([k, v]) => [k, v.short])].map(([val, label]) =>
              h('button', {
                key: val,
                onClick: () => setTierFilter(val),
                className: 'text-xs font-mono px-2.5 py-1 rounded-sm transition-all',
                style: {
                  background: tierFilter === val ? '#B5F33D' : 'rgba(255,255,255,0.04)',
                  color: tierFilter === val ? '#081505' : '#A0B090',
                }
              }, label)
            ),
            h('span', {
              className: 'w-px h-4 mx-2',
              style: { background: 'rgba(255,255,255,0.1)' }
            }),
            h('span', {
              className: 'text-[10px] uppercase tracking-widest font-mono mr-2',
              style: { color: '#7A8B6A' }
            }, 'Bucket:'),
            h('button', {
              onClick: () => setBucketFilter('all'),
              className: 'text-xs font-mono px-2.5 py-1 rounded-sm transition-all',
              style: {
                background: bucketFilter === 'all' ? '#B5F33D' : 'rgba(255,255,255,0.04)',
                color: bucketFilter === 'all' ? '#081505' : '#A0B090',
              }
            }, 'All'),
            buckets.map(b =>
              h('button', {
                key: b,
                onClick: () => setBucketFilter(b),
                className: 'text-xs font-mono px-2.5 py-1 rounded-sm transition-all',
                style: {
                  background: bucketFilter === b ? '#B5F33D' : 'rgba(255,255,255,0.04)',
                  color: bucketFilter === b ? '#081505' : '#A0B090',
                }
              }, b)
            )
          )
        ),

        // Master-Detail
        h('section', { className: 'relative z-10 px-8 pb-12 max-w-[1600px] mx-auto' },
          h('div', {
            className: 'grid grid-cols-12 gap-6',
            style: { minHeight: '70vh' }
          },
            // Left
            h('div', { className: 'col-span-5' },
              h('div', {
                className: 'rounded-sm overflow-hidden',
                style: { background: 'rgba(13,31,10,0.5)', border: '1px solid rgba(255,255,255,0.06)' }
              },
                h('div', {
                  className: 'flex items-center justify-between px-5 py-3 border-b',
                  style: { borderColor: 'rgba(255,255,255,0.06)' }
                },
                  h('div', {
                    className: 'text-[10px] uppercase tracking-widest font-mono',
                    style: { color: '#7A8B6A' }
                  }, 'Ranking · ' + filtered.length + ' of ' + PRIORITY_DATA.length),
                  h('div', {
                    className: 'text-[10px] uppercase tracking-widest font-mono',
                    style: { color: '#7A8B6A' }
                  }, 'Score')
                ),
                h('div', {
                  className: 'divide-y',
                  style: { borderColor: 'rgba(255,255,255,0.04)' }
                },
                  filtered.map(lead =>
                    h(LeadCard, {
                      key: lead.lead_id,
                      lead: lead,
                      isSelected: lead.lead_id === selectedId,
                      onClick: () => setSelectedId(lead.lead_id),
                    })
                  ),
                  filtered.length === 0 && h('div', {
                    className: 'px-5 py-12 text-center text-sm',
                    style: { color: '#7A8B6A' }
                  }, 'No leads match the current filters.')
                )
              )
            ),
            // Right
            h('div', { className: 'col-span-7' },
              h('div', {
                className: 'rounded-sm overflow-hidden h-full',
                style: { background: 'rgba(13,31,10,0.5)', border: '1px solid rgba(255,255,255,0.06)' }
              },
                selected
                  ? h(DetailPanel, { lead: selected })
                  : h('div', {
                      className: 'flex items-center justify-center h-full text-sm',
                      style: { color: '#7A8B6A' }
                    }, 'Select a lead to view details')
              )
            )
          )
        ),

        // Footer
        h('footer', {
          className: 'relative z-10 px-8 py-6 border-t',
          style: { borderColor: 'rgba(255,255,255,0.06)' }
        },
          h('div', {
            className: 'max-w-[1600px] mx-auto flex items-center justify-between text-[10px] uppercase tracking-widest font-mono',
            style: { color: '#5A7048' }
          },
            h('span', null, 'FZIOMED Signaling Radar · MVP v1'),
            h('span', null,
              'powered by ',
              h('span', { style: { color: '#B5F33D' } }, 'wearepalta'),
              ' 🥑'
            )
          )
        )
      );
    }

    // Boot
    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(h(App));
  </script>
</body>
</html>
